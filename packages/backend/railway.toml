[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && npm install && npm run build --workspace=packages/shared && cd packages/backend && npx prisma generate && npx tsc"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
