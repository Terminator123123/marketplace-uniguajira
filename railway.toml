[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build --workspace=packages/shared && cd packages/backend && npx prisma generate && npx prisma migrate deploy && npx tsc"

[deploy]
startCommand = "node packages/backend/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
